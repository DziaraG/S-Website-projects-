    <title>Dash Ramp | CSA Guide</title>
    <style>
        :root {
            --bg: #050505; 
            --card: #0f0f0f; 
            --border: #222; 
            --accent: #57bb8a; 
            --text: #ccc;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 40px 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        h1 { color: #fff; margin: 0; padding-bottom: 10px; font-size: 32px; text-transform: uppercase; }

        .main-wrapper { display: flex; gap: 40px; align-items: flex-start; }
        .content-left { flex: 1; }
        
        .vid-right { width: 350px; position: sticky; top: 40px; }
        .vid-box { 
            background: #000; border: 1px solid var(--border); 
            width: 100%; 
            height: 622px; 
            display: flex; align-items: center; justify-content: center;

            border-radius: 4px;
        }

        .diff-value { font-weight: bold; color: #ff9800; text-transform: uppercase; } 

        .key { background: #333; padding: 3px 8px; border-radius: 4px; color: #fff; font-family: monospace; border-bottom: 2px solid #000; margin: 0 2px; font-size: 13px; }
        
        .back-link { color: var(--accent); text-decoration: none; font-size: 12px; display: block; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        .back-link:hover { color: #fff; }
    </style>
</head>
